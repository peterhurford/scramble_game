<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Scramble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: banner and top bar, the race track across the full width, then two columns:
   the desk (goal, actions) and a tabbed sidebar (cabinet, Beijing, labs, log). */
:root{
  --bg:#E3E8ED; --sheet:#F8F9FB; --sheet2:#EEF2F6; --ink:#15202B; --muted:#56626F; --faint:#9AA6B2; --rule:#C8D0D9;
  --accent:#1A4480; --accent-ink:#FFFFFF; --accent-soft:#DCE6F3;
  --good:#22744A; --bad:#B42318; --warn:#9A5B00; --cn:#B8323A; --us:#1A4480; --paper:#F4F1E8;
  --u:#007A33; --s:#C8102E; --ts:#FF8C00;
  --f-ui:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 0 var(--rule),0 14px 30px -26px rgba(10,20,40,.55);
  /* phase palettes: accent, soft fill, page tint */
  --p0:#1A4480; --p0-soft:#DCE6F3; --p0-bg:#E3E8ED;
  --scr:#A34D00; --scr-soft:#F6E2CB; --scr-bg:#EDE5DA;
  --p1:#0E6B62; --p1-soft:#D2ECE7; --p1-bg:#DDE9E6;
  --war-bg:#F0D6D3; --hazard:#9A5B00;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --sheet:#151E28; --sheet2:#1B2632; --ink:#E3E9EF; --muted:#9AA7B4; --faint:#5F6D7B; --rule:#2A3746;
  --accent:#8FB4EC; --accent-ink:#0D131A; --accent-soft:#1E3150;
  --good:#6FD39A; --bad:#F38A80; --warn:#F2B65C; --cn:#F0828A; --us:#8FB4EC; --paper:#1A2028; --shadow:0 1px 0 var(--rule); color-scheme:dark;
  --p0:#8FB4EC; --p0-soft:#1E3150; --p0-bg:#0D131A; --scr:#F2A65A; --scr-soft:#3A2A18; --scr-bg:#1C150D; --p1:#6FCFC2; --p1-soft:#15332F; --p1-bg:#0A1A18; --war-bg:#260F13; --hazard:#F2B65C;}}
:root[data-theme="dark"]{
  --bg:#0D131A; --sheet:#151E28; --sheet2:#1B2632; --ink:#E3E9EF; --muted:#9AA7B4; --faint:#5F6D7B; --rule:#2A3746;
  --accent:#8FB4EC; --accent-ink:#0D131A; --accent-soft:#1E3150;
  --good:#6FD39A; --bad:#F38A80; --warn:#F2B65C; --cn:#F0828A; --us:#8FB4EC; --paper:#1A2028; --shadow:0 1px 0 var(--rule); color-scheme:dark;
  --p0:#8FB4EC; --p0-soft:#1E3150; --p0-bg:#0D131A; --scr:#F2A65A; --scr-soft:#3A2A18; --scr-bg:#1C150D; --p1:#6FCFC2; --p1-soft:#15332F; --p1-bg:#0A1A18; --war-bg:#260F13; --hazard:#F2B65C;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.45}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ico{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex-shrink:0}
.ico.lg{width:26px;height:26px;color:var(--accent)}
.banner{position:sticky;top:0;z-index:30;text-align:center;font-weight:800;font-size:11.5px;letter-spacing:.16em;padding:4px 16px;color:#fff;background:var(--u)}
.banner[data-level="S"]{background:var(--s)} .banner[data-level="TS"]{background:var(--ts);color:#111}
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.sub{font-size:12.5px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sp{flex:1}
.up{color:var(--good)} .dn{color:var(--bad)}
.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border:1px solid currentColor;line-height:1.3;white-space:nowrap}
.pill.good{color:var(--good)}.pill.bad{color:var(--bad)}.pill.warn{color:var(--warn)}.pill.muted{color:var(--muted)}.pill.acc{color:var(--accent)}
/* phases: each sets the accent and page tint; a Strait crisis tints on top */
body[data-phase="p0"]{--accent:var(--p0);--accent-soft:var(--p0-soft);--bg:var(--p0-bg)}
body[data-phase="scramble"]{--accent:var(--scr);--accent-soft:var(--scr-soft);--bg:var(--scr-bg)}
body[data-phase="p1"]{--accent:var(--p1);--accent-soft:var(--p1-soft);--bg:var(--p1-bg)}
body[data-crisis="war"]{--bg:var(--war-bg)}
body[data-phase] .top{border-top:3px solid var(--accent)}
body[data-crisis="war"] .top{border-top-color:var(--bad);box-shadow:0 2px 0 var(--bad)}
body[data-crisis="quarantine"] .top{box-shadow:0 4px 0 -1px transparent;background-image:repeating-linear-gradient(135deg,var(--hazard) 0 8px,transparent 8px 16px);background-size:100% 4px;background-repeat:no-repeat;background-position:bottom}
/* phase ribbon: where you are in the game, the phase clock, and any Strait crisis */
.ribbon{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--sheet);border:1px solid var(--rule);border-left:5px solid var(--accent);border-radius:6px;padding:10px 14px}
.phases{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0;padding:0;list-style:none}
.phases li{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--faint);padding:4px 10px;border-radius:999px;white-space:nowrap}
.phases li{position:relative} .phases li+li{margin-left:18px}
.phases li+li::before{content:"";position:absolute;left:-18px;top:50%;width:14px;height:1px;background:var(--rule)}
.phases li.done{color:var(--muted)} .phases li.done b::before{content:"\2713\00a0"}
.phases li.now{color:var(--accent-ink);background:var(--accent)}
.phases li.now b{font-weight:800}
.ribbon .clock{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-left:auto}
.ribbon .clock b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.ticks14{display:flex;gap:3px} .ticks14 i{width:14px;height:8px;background:var(--rule)} .ticks14 i.on{background:var(--accent)}
.crisis{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:4px 10px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.08em}
.crisis.war{color:var(--bad)} .crisis.quar{color:var(--hazard)}
.crisis .meter{width:80px}
@media (max-width:600px){.ribbon .clock{margin-left:0}.phases li{padding:3px 8px}}
/* top bar */
.top{position:sticky;top:23px;z-index:25;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top-in{max-width:1400px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.mark{font-weight:900;font-size:18px;letter-spacing:-.01em;line-height:1}
.mark small{display:block;font-weight:600;font-size:11.5px;letter-spacing:0;color:var(--muted);margin-top:4px}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;flex:1;min-width:0}
.sgroup{display:flex;flex-wrap:wrap;gap:2px}
.sgroup+.sgroup{padding-left:18px;border-left:1px solid var(--rule)}
.stat{all:unset;box-sizing:border-box;position:relative;cursor:pointer;padding:3px 9px;border-radius:4px;transition:background .3s}
.stat:hover{background:var(--sheet2)} .stat:focus-visible{outline:2px solid var(--accent)}
.stat span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat b{display:block;font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat b small{font-size:11px;color:var(--faint);font-weight:500}
.stat.hot b{color:var(--bad)}
.stat .dl{position:absolute;top:-8px;right:-4px;font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:700;padding:0 4px;background:var(--sheet);border:1px solid currentColor;animation:floatup 2.4s ease-out forwards}
.stat.flashg{animation:fg 1.2s} .stat.flashb{animation:fb 1.2s}
@keyframes fg{0%{background:color-mix(in srgb,var(--good) 30%,var(--sheet))}100%{background:transparent}}
@keyframes fb{0%{background:color-mix(in srgb,var(--bad) 30%,var(--sheet))}100%{background:transparent}}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.dots{letter-spacing:1px;color:var(--accent)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--f-ui);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:10px 16px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{filter:brightness(1.08)} .btn:focus-visible,.ghost:focus-visible,.act:focus-visible,.opt:focus-visible,.tab:focus-visible,.choice:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.ghost{all:unset;box-sizing:border-box;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--accent);border:1px solid var(--accent);padding:7px 11px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ghost:hover{background:var(--accent-soft)} .ghost[disabled]{opacity:.4;cursor:not-allowed}
.ghost.sm{padding:3px 7px;font-size:11.5px}
.kbd{font-family:var(--f-mono);font-size:11px;opacity:.75;border:1px solid currentColor;padding:0 4px}
/* layout */
.wrap{max-width:1400px;margin:0 auto;padding:16px;display:grid;gap:16px}
.main{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 360px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}.top{position:static}}
@media (max-width:600px){.sgroup+.sgroup{padding-left:0;border-left:0}.stats{gap:4px 6px;flex-basis:100%;order:3}}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;min-width:0;overflow:clip}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding:10px 16px 0}
.ph h2{margin:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.pb{padding:12px 14px}
/* sidebar */
.side{position:sticky;top:96px;max-height:calc(100vh - 112px);overflow:auto}
@media (max-width:980px){.side{position:static;max-height:none}}
.stabs{display:flex;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--sheet);z-index:1}
.stab{all:unset;flex:1;text-align:center;cursor:pointer;font-size:12.5px;font-weight:700;padding:10px 4px 8px;color:var(--muted);border-bottom:3px solid transparent}
.stab:hover{color:var(--ink)} .stab.on{color:var(--ink);border-bottom-color:var(--accent)} .stab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sb{padding:12px 14px;border-bottom:1px solid var(--rule)} .sb:last-child{border-bottom:0}
.sb .row{margin-bottom:6px}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--rule)} .split i{display:block;height:100%}
/* meters */
.meter{height:7px;background:var(--rule);position:relative;overflow:hidden;min-width:40px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .5s}
.meter.bad i{background:var(--bad)} .meter.warn i{background:var(--warn)} .meter.good i{background:var(--good)}
.meter.thin{height:4px}
.meter .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.6}
/* race strip */
.race .sx{overflow-x:auto}
.race .strip{display:block;width:100%;min-width:620px;height:auto;padding:0 8px 4px}
svg text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
svg text.big{font-family:var(--f-ui);font-size:12px;font-weight:700;fill:var(--ink)} svg text.dz{font-family:var(--f-ui);font-size:10.5px;font-weight:700;fill:var(--bad)}
svg text.tok{font-family:var(--f-ui);font-size:9.5px;font-weight:800;fill:#fff}
.readouts{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:12.5px;color:var(--muted)}
.readouts b{color:var(--ink);font-weight:700}
.readouts .hot,.readouts .hot b{color:var(--bad)}
.chart{width:100%;height:auto;display:block}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px}
.kv .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
/* indicators */
.ind{display:grid;grid-template-columns:minmax(0,1fr) 62px;grid-template-areas:"n val" "m mk";gap:3px 10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--rule)}
.ind:last-of-type{border-bottom:0}
.ind .n{grid-area:n;font-size:13px;font-weight:600}
.ind .val{grid-area:val;font-family:var(--f-mono);font-size:13px;text-align:right;font-weight:600}
.ind .meter{grid-area:m}.ind .mkl{grid-area:mk;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}
/* Beijing */
.fac{display:flex;height:18px;margin:2px 0}
.fac div{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;letter-spacing:.08em;overflow:hidden;white-space:nowrap;transition:width .5s}
.fac .m{background:#6B7C93}.fac .sec{background:#B8323A}.fac .sci{background:#3B8A7E}
.stack{display:flex;height:12px;background:var(--rule)} .stack i{display:block;height:100%;transition:width .5s}
.legend{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.okbox{margin-top:10px;padding:7px 10px;border:1px solid var(--good);color:var(--good);font-weight:700;font-size:12.5px;display:flex;gap:6px;align-items:center}
/* desk */
.obj{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--rule)}
.goal{flex:1 1 320px;min-width:0}
.pres{flex:0 1 300px;font-family:var(--f-body);font-style:italic;font-size:14px;color:var(--muted);line-height:1.35}
.pres span{display:block;font-family:var(--f-ui);font-style:normal;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.goal h3{margin:0 0 6px;font-size:17px;font-weight:800;letter-spacing:-.01em}
.obrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);margin:4px 0}
.obrow small{color:var(--faint)}
.ticks{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;margin-top:6px}
.ticks span{color:var(--muted)} .ticks span.ok{color:var(--good)} .ticks b{color:var(--ink);font-weight:600}
.result{position:relative;margin:12px 16px 0;border-left:3px solid var(--good);background:var(--sheet2);padding:8px 34px 8px 12px;font-family:var(--f-body);font-size:15px}
.result b{font-family:var(--f-ui)}
.result .x{all:unset;cursor:pointer;position:absolute;top:4px;right:8px;font-size:18px;line-height:1;color:var(--muted);padding:2px 4px}
.result .x:hover{color:var(--ink)}
.deskgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);min-height:440px}
@media (max-width:1000px){.deskgrid{grid-template-columns:minmax(0,1fr)}}
.alist{border-right:1px solid var(--rule)}
@media (max-width:1000px){.alist{border-right:0;border-bottom:1px solid var(--rule);max-height:360px;overflow:auto}}
.detail{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 112px);overflow:auto}
@media (max-width:1000px){.detail{position:static;max-height:none}}
.cats{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px 4px}
.cat{all:unset;cursor:pointer;position:relative;font-size:11.5px;font-weight:700;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:2px 9px}
.cat b{font-family:var(--f-mono);font-weight:600;color:var(--faint)} .cat:hover{border-color:var(--accent);color:var(--ink)}
.cat.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .cat.on b{color:var(--accent-ink)}
.cat:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cat .dot{position:absolute;top:-2px;right:-2px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--sheet)}
.agrp.new{color:var(--accent)}
.more{all:unset;cursor:pointer;position:sticky;bottom:12px;display:block;width:max-content;margin:8px auto;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:5px 14px;box-shadow:0 4px 14px -4px rgba(10,20,40,.45)}
.more[hidden]{display:none}
.act{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;width:100%;cursor:pointer;padding:10px 14px;border-bottom:1px solid var(--rule)}
.act:hover{background:var(--sheet2)} .act.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.act .t{font-weight:700;font-size:13.5px;line-height:1.25}
.act.short{opacity:.72} .act.lock{opacity:.62} .act.lock .t{font-weight:600}
.act .why{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:2px}
.act .why .ico{width:11px;height:11px;flex:none}
.cost .lack{color:var(--bad)}
.agrp{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:12px 14px 4px}
.later summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);padding:12px 14px}
.later summary:hover{color:var(--ink)}
.cost{display:inline-flex;gap:7px;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;align-items:center}
.cost span{display:inline-flex;gap:2px;align-items:center}
.cost .ico{width:13px;height:13px}
.pips{display:inline-flex;gap:2px;vertical-align:1px;margin-left:4px}
.pips i{width:7px;height:7px;border:1px solid var(--accent)} .pips i.on{background:var(--accent)}
.fx{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px}
.fx.sm{margin:3px 0 0;gap:3px}
.fxc{font-size:11.5px;font-weight:600;padding:2px 7px;line-height:1.35;border-radius:999px}
.fx.sm .fxc{font-size:10.5px;padding:1px 6px}
.fxc.g{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.fxc.b{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.fxc.n{background:var(--sheet2);color:var(--muted);border:1px solid var(--rule)}
.detail{padding:14px 16px;min-width:0}
.dh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.dh h3{margin:0 0 3px;font-size:18px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.detail .desc{font-family:var(--f-body);font-size:15px;margin:0 0 10px;max-width:68ch}
.opts{display:grid;gap:6px;margin:0 0 12px}
.opts.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--rule);padding:8px 10px;background:var(--sheet)}
.opt:hover{border-color:var(--accent)} .opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt b{display:block;font-size:13px} .opt small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.dice{position:relative;height:22px;background:color-mix(in srgb,var(--bad) 16%,var(--sheet2));margin:2px 0 10px;overflow:visible}
.dice .zone{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--good) 40%,var(--sheet2))}
.dice .dl2{position:absolute;left:8px;top:2px;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--ink)}
.dice .marker{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;background:var(--ink);transition:left 1.1s cubic-bezier(.2,.9,.3,1.15)}
