<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Scramble: Room Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* One projected screen: top bar, the race track, six gauges, then the five cabinet groups' options or the turn's events. */
:root{
  --bg:#E3E8ED; --sheet:#F8F9FB; --sheet2:#EEF2F6; --ink:#15202B; --muted:#56626F; --faint:#9AA6B2; --rule:#C8D0D9;
  --accent:#1A4480; --accent-ink:#fff; --accent-soft:#DCE6F3;
  --good:#22744A; --bad:#B42318; --warn:#9A5B00; --cn:#B8323A; --us:#1A4480;
  --f-ui:"Public Sans","Helvetica Neue",Arial,sans-serif; --f-body:"Source Serif 4",Georgia,serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --sheet:#151E28; --sheet2:#1B2632; --ink:#E3E9EF; --muted:#9AA7B4; --faint:#5F6D7B; --rule:#2A3746;
  --accent:#8FB4EC; --accent-ink:#0D131A; --accent-soft:#1E3150; --good:#6FD39A; --bad:#F38A80; --warn:#F2B65C; --cn:#F0828A; --us:#8FB4EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131A; --sheet:#151E28; --sheet2:#1B2632; --ink:#E3E9EF; --muted:#9AA7B4; --faint:#5F6D7B; --rule:#2A3746;
  --accent:#8FB4EC; --accent-ink:#0D131A; --accent-soft:#1E3150; --good:#6FD39A; --bad:#F38A80; --warn:#F2B65C; --cn:#F0828A; --us:#8FB4EC; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:clamp(14px,1.15vw,19px);line-height:1.4}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:.72em;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1700px;margin:0 auto;padding:0 16px 20px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:10px 0;border-bottom:3px double var(--rule)}
.mark{font-weight:900;font-size:1.25em;letter-spacing:-.01em}
.mark small{font-weight:700;font-size:.6em;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-left:8px}
.pips{display:flex;gap:5px;align-items:center}
.pips i{width:26px;height:10px;background:var(--rule)} .pips i.done{background:var(--accent)} .pips i.now{background:var(--accent);outline:2px solid var(--accent);outline-offset:2px}
.date{font-weight:800;font-size:1.15em}
.sp{flex:1}
.clock{text-align:right;line-height:1.15} .clock b{font-family:var(--f-mono);font-size:1.5em;font-weight:600} .clock b.late{color:var(--bad)}
.ghost{all:unset;box-sizing:border-box;cursor:pointer;font-weight:700;font-size:.8em;color:var(--accent);border:1px solid var(--accent);padding:6px 10px;white-space:nowrap}
.ghost:hover{background:var(--accent-soft)} .ghost[disabled]{opacity:.35;cursor:not-allowed}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:14px 26px;text-align:center}
.btn:hover{filter:brightness(1.1)} .btn[disabled]{opacity:.35;cursor:not-allowed;filter:none}
:is(.btn,.ghost,.opt):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--sheet);border:1px solid var(--rule);padding:12px 16px;margin-top:12px}

/* the race track: months of frontier progress, -6 to 22 */
.track{position:relative;height:118px;margin:4px 56px 0}
.rail{position:absolute;left:0;right:0;top:54px;height:10px;background:var(--sheet2);border:1px solid var(--rule)}
.band{position:absolute;top:26px;height:66px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bad) 30%,transparent) 0 6px,color-mix(in srgb,var(--bad) 10%,transparent) 6px 12px);border-left:2px solid var(--bad);border-right:2px solid var(--bad);transition:left .8s,width .8s}
.band span{position:absolute;left:50%;top:-22px;transform:translateX(-50%);white-space:nowrap;font-size:.72em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--bad)}
.truth{position:absolute;top:18px;height:82px;width:0;border-left:3px solid var(--ink)}
.truth span{position:absolute;top:-20px;left:-3px;white-space:nowrap;font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.tick{position:absolute;top:66px;width:1px;height:8px;background:var(--faint)} .tick span{position:absolute;top:36px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:.68em;color:var(--faint);white-space:nowrap}
.mk{position:absolute;transform:translateX(-50%);transition:left .9s cubic-bezier(.3,.7,.3,1);font-weight:900;font-size:.8em;letter-spacing:.06em;color:#fff;padding:3px 9px;white-space:nowrap}
.mk::after{content:"";position:absolute;left:50%;margin-left:-6px;border:6px solid transparent}
.mk.us{top:26px;background:var(--us);color:var(--accent-ink)} .mk.us::after{top:100%;border-top-color:var(--us)}
.mk.cn{top:70px;background:var(--cn);color:var(--accent-ink)} .mk.cn::after{bottom:100%;border-bottom-color:var(--cn)}
@media (prefers-reduced-motion:reduce){.mk,.band{transition:none}}

.gauges{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}
.g{background:var(--sheet);border:1px solid var(--rule);padding:9px 13px;min-width:0}
.g b{display:block;font-size:1.2em;font-weight:900;line-height:1.2;margin:2px 0}
.g .sub{font-size:.82em;color:var(--muted)} .g .sub strong{color:var(--ink)}
.g{border-top:4px solid var(--rule)} .g.good{border-top-color:var(--good)} .g.warn{border-top-color:var(--warn)} .g.bad{border-top-color:var(--bad)}
.g.good b{color:var(--good)} .g.warn b{color:var(--warn)} .g.bad b,.g.bad .sub strong{color:var(--bad)}
.g .was{display:block;font-size:.78em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)} .g.chg{animation:chg 1.6s 1}
@keyframes chg{0%{background:var(--accent-soft)}100%{background:var(--sheet)}}
.pill{display:inline-block;margin:3px 4px 0 0;padding:1px 7px;border:1px solid var(--rule);font-weight:700;color:var(--ink);white-space:nowrap}
.pill.ok{border-color:var(--good);color:var(--good)} .pill.no{border-color:var(--bad);color:var(--bad)} .pill.unk{border-style:dashed;color:var(--muted)}
.opt .new{float:right;font-style:normal;font-size:.66em;font-weight:900;letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:1px 6px;margin-left:6px}
@media (prefers-reduced-motion:reduce){.g.chg{animation:none}}
.bar{height:7px;background:var(--sheet2);border:1px solid var(--rule);margin:5px 0 3px} .bar i{display:block;height:100%;background:var(--accent);transition:width .8s}
.bar.t i{background:var(--bad)}

.ask{display:flex;align-items:baseline;gap:12px;margin:16px 0 6px} .ask h2{margin:0;font-size:1.05em;font-weight:900;letter-spacing:.02em} .ask span{color:var(--muted);font-size:.85em}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.seat{background:var(--sheet);border:1px solid var(--rule);border-top:5px solid var(--accent);padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px;min-width:0}
.seat.set{border-top-color:var(--good)}
.seat h3{margin:0;font-size:1.05em;font-weight:900;line-height:1.15} .seat .brief{font-size:.78em;color:var(--muted);margin-top:1px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:block;border:2px solid var(--rule);background:var(--sheet2);padding:6px 9px}
.opt:hover{border-color:var(--accent)} .opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.opt[disabled]{opacity:.4;cursor:not-allowed;border-color:var(--rule)}
.opt b{display:block;font-weight:900;line-height:1.2} .opt span{display:block;font-family:var(--f-body);font-size:.82em;line-height:1.3;color:var(--muted);margin-top:2px} .opt.on span{color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px} .tags span{font-size:.82em;border:1px solid var(--rule);background:var(--sheet);padding:3px 9px} .tags i{font-style:normal;font-weight:800;color:var(--accent);margin-right:6px}
.go{display:flex;align-items:center;gap:16px;margin-top:14px} .go .hint{color:var(--muted);font-size:.85em}

.evs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.ev{background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--faint);padding:9px 14px;animation:in .45s both}
.ev b{font-weight:900;font-size:1.08em} .ev p{margin:2px 0 0;font-family:var(--f-body)}
.ev .src{font-size:.72em;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:2px} .ev.clip p{font-style:italic}
.ev.big{grid-column:1/-1;border:2px solid var(--bad);border-left-width:14px;padding:18px 22px;animation:in .45s both,alarm 1.1s 3 both}
.ev.big b{display:block;font-size:2.3em;line-height:1.05;text-transform:uppercase;letter-spacing:.02em} .ev.big p{font-size:1.25em;margin-top:8px} .ev.big .src::before{content:'Flash · ';color:var(--bad);font-weight:900}
@keyframes alarm{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 8px var(--bad)}}
.ev.good{border-left-color:var(--good)} .ev.good b{color:var(--good)} .ev.bad{border-left-color:var(--bad)} .ev.bad b{color:var(--bad)} .ev.warn{border-left-color:var(--warn)} .ev.warn b{color:var(--warn)}
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 97%,transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.news{background:var(--sheet);border:1px solid var(--rule);border-top:8px solid var(--faint);width:min(1100px,100%);box-shadow:0 30px 80px -30px rgba(0,0,0,.6);animation:in .3s both}
.news.good{border-top-color:var(--good)} .news.bad{border-top-color:var(--bad)} .news.warn{border-top-color:var(--warn)}
.news .mh{display:flex;justify-content:space-between;gap:16px;padding:10px 26px;border-bottom:1px solid var(--rule);font-family:var(--f-mono);font-size:.85em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)} .news .mh b{color:var(--ink)}
.news .mb{padding:22px 26px 8px} .news h2{margin:0 0 12px;font-size:2.5em;line-height:1.05;font-weight:900} .news p{margin:0;font-family:var(--f-body);font-size:1.5em;line-height:1.35}
.news.good h2{color:var(--good)} .news.bad h2{color:var(--bad)} .news.warn h2{color:var(--warn)} .news.clip p{font-style:italic}
.news .go{padding:0 26px 22px} .news .pips{display:flex;gap:5px;margin-left:auto} .news .pips i{width:22px;height:6px;background:var(--rule)} .news .pips i.done{background:var(--accent)}
.news.big{border:3px solid var(--bad);border-top-width:8px;animation:in .3s both,alarm 1.1s 3 both} .news.big h2{font-size:4em;text-transform:uppercase;letter-spacing:.01em} .news.big .mh span:first-child::before{content:'Flash · ';color:var(--bad);font-weight:900}
.news p.rule{margin-top:16px;font-style:normal;font-family:var(--f-mono);font-size:1.05em;line-height:1.4;padding:12px 14px;border-left:5px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.news.crisisn{border:3px solid var(--warn);border-top-width:8px} .news.crisisn .mh span:first-child::before{content:'Crisis · ';color:var(--warn);font-weight:900}
.news.tease{border-top-color:var(--accent)} .news.tease h2{font-size:2.8em} .news.tease p.rule{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);font-size:1.4em}
.crisis{display:flex;align-items:baseline;gap:14px;margin:14px 0 0;padding:10px 14px;border:2px solid var(--warn);border-left-width:8px;background:color-mix(in srgb,var(--warn) 9%,transparent)} .crisis b{font-size:1.15em;font-weight:900;color:var(--warn);white-space:nowrap} .crisis span{font-size:1em}
@media (prefers-reduced-motion:reduce){.news,.news.big{animation:none}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ev,.ev.big{animation:none}}

.intro{max-width:1100px;margin:3vh auto 0} .intro h1{font-size:3em;font-weight:900;letter-spacing:-.02em;margin:0 0 4px} .intro .lede{font-family:var(--f-body);font-size:1.3em;margin:8px 0 18px;max-width:38em}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px} .three div{background:var(--sheet);border:1px solid var(--rule);border-top:5px solid var(--accent);padding:12px 16px} .three h3{margin:0 0 4px;font-size:1.1em;font-weight:900} .three p{margin:0;font-family:var(--f-body)}
.how{font-family:var(--f-body);font-size:1.08em;margin:18px 0} .how li{margin:5px 0}
.fine{font-size:.8em;color:var(--muted);margin-top:14px}
.end{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;align-items:center}
.grade{font-size:7em;font-weight:900;line-height:1;width:1.5em;height:1.5em;display:grid;place-items:center;border:6px solid currentColor}
.grade.A,.grade.B{color:var(--good)} .grade.C{color:var(--warn)} .grade.D,.grade.F{color:var(--bad)}
.end h1{margin:0;font-size:2.6em;font-weight:900;letter-spacing:-.02em} .end p{margin:6px 0 0;font-family:var(--f-body);font-size:1.25em;max-width:40em}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px} .cols ul{margin:6px 0 0;padding-left:1.1em;font-family:var(--f-body)} .cols li{margin:4px 0}
table{border-collapse:collapse;width:100%;margin-top:6px;font-size:.92em} td{padding:4px 10px 4px 0;border-bottom:1px solid var(--rule)} td:first-child{color:var(--muted);white-space:nowrap} th{text-align:left;font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 10px 4px 0}
@media (max-width:900px){.gauges{grid-template-columns:repeat(2,1fr)}.seats,.three,.cols,.evs{grid-template-columns:1fr}.end{grid-template-columns:1fr}.grade{font-size:4em}.intro h1{font-size:2.1em}.tick span{display:none}}
</style>

<body>
<div class="wrap" id="app"></div>
<script src="engine.js"></script>
<script>
'use strict';
// Rendering and the facilitator's controls; all rules are in engine.js.
// Each group's principal announces a choice and the facilitator clicks it (Enter locks in, Space moves on, U undoes a turn).
// Nothing on screen is a precise number: odds are the IC's words, distances are rounded months.
// TURN_SECS covers a whole round: the crisis, the decision and the news.
const TURN_SECS = 240, NEWS_SECS = 60, GAME_MINS = 30, SAVE = 'scramble-room-v4';
const SHORT = { vp: 'President', dni: 'DNI', doc: 'Commerce', state: 'State', war: 'War' };
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
// news: index of the bulletin on screen (-1 none); shown: its result is revealed; brief: the turn's crisis is on screen.
let st = { screen: 'intro', game: null, past: [], events: [], news: -1, shown: false, brief: false, picks: {}, t0: 0, turnT0: 0 };

function seedFromHash() { const m = /seed=([\w-]+)/.exec(location.hash); return m ? m[1] : String(Math.floor(Math.random() * 1e6)); }
function save() { try { localStorage.setItem(SAVE, JSON.stringify(st)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem(SAVE)); if (s && s.game) st = s; } catch (e) {} }
const ready = () => Room.seats(st.game).every(s => s.opts.some(o => o.id === st.picks[s.id] && !o.off));

function start(seed) {
  st = { screen: 'decide', game: Room.newGame(seed), past: [], events: [], picks: {}, t0: Date.now(), turnT0: Date.now() };
  draw();
}
function lockIn() {
  if (st.screen !== 'decide' || !ready()) return;
  st.past.push(JSON.stringify(st.game));
  st.events = Room.play(st.game, st.picks);
  st.screen = 'resolve'; st.news = 0; st.shown = false; draw();
}
const inNews = () => st.screen === 'resolve' && st.news >= 0 && st.news < st.events.length;
function nextNews(skip) {
  if (!skip && st.events[st.news].tease && !st.shown) st.shown = true;
  else { st.news = skip || st.news + 1 >= st.events.length ? -1 : st.news + 1; st.shown = false; }
  draw();
}
function endBrief() { st.brief = false; draw(); }
function next() {
  if (st.screen !== 'resolve') return;
  if (st.game.over) st.screen = 'end';
  else { st.screen = 'decide'; st.picks = {}; st.turnT0 = Date.now(); st.brief = !!st.game.crisis; }
  draw();
}
function undo() {
  if (!st.past.length) return;
  st.game = JSON.parse(st.past.pop()); st.screen = 'decide'; st.picks = {}; st.events = []; st.news = -1; st.brief = false; st.turnT0 = Date.now(); draw();
}

const X0 = -6, X1 = 22, pos = x => Math.max(0, Math.min(100, (x - X0) / (X1 - X0) * 100)) + '%';
function track(g, v, reveal) {
  let h = '<div class="track"><div class="rail"></div>';
  h += '<div class="band" style="left:' + pos(v.lo) + ';width:calc(' + pos(v.hi) + ' - ' + pos(v.lo) + ')">' + (reveal ? '' : '<span>IC suggests runaway RSI possible in this range</span>') + '</div>';
  for (let x = X0; x <= X1; x += 2) h += '<div class="tick" style="left:' + pos(x) + '">' + (x % 6 === 0 ? '<span>' + (x === 0 ? 'Jan 2027 frontier' : (x > 0 ? '+' : '-') + Math.abs(x) + ' months') + '</span>' : '') + '</div>';
  if (reveal) h += '<div class="truth" style="left:' + pos(g.line) + '"><span>Runaway RSI was possible from here</span></div>';
  h += '<div class="mk us" style="left:' + pos(g.us) + '">US</div>';
  h += '<div class="mk cn" style="left:' + pos(reveal ? g.cn : g.cnShown) + '">CHINA</div></div>';
  return h;
}
function gauges(g, v) {
  // On the resolve screen each gauge says what it read before the turn, so the room sees what moved.
  const pv = st.screen === 'resolve' && st.past.length ? Room.view(JSON.parse(st.past[st.past.length - 1])) : null;
  const G = (lvl, lbl, big, sub, was) => { const ch = pv && was && was !== big; return '<div class="g ' + lvl + (ch ? ' chg' : '') + '"><div class="lbl">' + lbl + '</div><b>' + big + '</b>' + (ch ? '<span class="was">was ' + was.toLowerCase() + '</span>' : '') + '<div class="sub">' + sub + '</div></div>'; };
  const prevDeal = pv && JSON.parse(st.past[st.past.length - 1]).deal;
  const pills = Room.price(g, st.screen === 'decide' ? st.picks : {}).map(a => !a.known ? '<span class="pill unk">? unknown</span>' : '<span class="pill ' + (a.met ? 'ok' : 'no') + '" title="' + esc(a.want) + '">' + (a.met ? '✓ ' : '✗ ') + esc(a.short) + '</span>').join('');
  const rsi = x => x.knownOver ? 'Past the danger point' : x.overNowP <= 0 ? 'Short of the range' : x.overNowP < 1 ? 'Inside the range' : 'Beyond the range';
  const beijing = (x, deal, caught) => deal ? (caught ? 'Caught cheating' : 'Mutual pause') : x.trustText;
  return '<div class="gauges">' +
    G(g.deal ? '' : v.lead < 2 ? 'bad' : v.lead < 4 ? 'warn' : 'good', 'US lead', cap(v.leadText), g.deal ? 'By Beijing\'s own account' : v.lead >= 1 ? 'China is behind' : 'The lead is gone', pv && cap(pv.leadText)) +
    G(['bad', 'warn', 'good'][g.sec], 'The weights', cap(v.security), 'Stolen this turn: <strong>' + v.theft + '</strong>' + (g.thefts ? ' · already stolen' + (g.thefts > 1 ? ' ' + g.thefts + ' times' : ' once') : ''), pv && cap(pv.security)) +
    G(v.tensionText === 'Calm' ? 'good' : v.tensionText === 'Tense' ? 'warn' : 'bad', 'Taiwan Strait', v.tensionText, 'War this turn: <strong>' + v.war + '</strong>', pv && pv.tensionText) +
    G(g.deal ? (g.caught ? 'bad' : 'good') : v.trustText === 'Hostile' ? 'bad' : v.trustText === 'Wary' ? 'warn' : 'good', 'Beijing', beijing(v, g.deal, g.caught),
      g.deal ? 'Inspectors: <strong>' + (g.inspectors ? 'on the ground' : 'none') + '</strong> · trust: ' + v.trustText.toLowerCase() : 'Its price for a pause' + (st.screen === 'decide' ? ', as picked so far' : '') + ':<br>' + pills, pv && beijing(pv, prevDeal, false)) +
    G(g.national ? '' : v.labsText === 'Defiant' ? 'bad' : v.willing ? 'good' : 'warn', 'The labs', v.labsText, g.national ? 'They answer to the President' : v.willing ? 'Would accept a pause' : v.labsText === 'Defiant' ? 'Will not hold, even if ordered' : 'Would not accept a pause', pv && pv.labsText) +
    G(v.knownOver || v.overNowP >= 1 ? 'bad' : v.overNowP > 0 ? 'warn' : 'good', 'Runaway RSI', rsi(v), v.knownOver ? 'The US frontier can improve itself' : (v.overNowP > 0 ? 'Possible now: <strong>' + v.overNow + '</strong> · a' : 'A') + 'fter a turn of racing: <strong>' + v.overIfRace + '</strong>', pv && rsi(pv)) +
    '</div>';
}
function topbar(g) {
  let pips = ''; for (let i = 0; i < Room.TUNE.turns; i++) pips += '<i class="' + (i < g.turn - (st.screen === 'resolve' && !g.over ? 1 : 0) ? 'done' : i === g.turn - (st.screen === 'resolve' ? 1 : 0) && !g.over ? 'now' : '') + '"></i>';
  return '<div class="top"><div class="mark">The Scramble<small>Room Edition</small></div><div class="pips">' + pips + '</div>' +
    '<div class="date">' + (st.screen === 'end' ? 'The end' : st.screen === 'resolve' ? 'Turn ' + g.votes.length + ' of ' + Room.TUNE.turns + ' · what happened' : 'Turn ' + (g.turn + 1) + ' of ' + Room.TUNE.turns + ' · ' + Room.DATES[g.turn]) + '</div><div class="sp"></div>' +
    '<div class="clock"><div class="lbl">This round · lock in by ' + mmss(NEWS_SECS) + '</div><b id="ck-turn">-</b></div><div class="clock"><div class="lbl">Game</div><b id="ck-game">-</b></div>' +
    '<button class="ghost" id="b-undo"' + (st.past.length ? '' : ' disabled') + '>Undo turn (U)</button><button class="ghost" id="b-new">Restart</button></div>';
}

function draw() {
  const g = st.game; let h = '';
  if (st.screen === 'intro') h = intro();
  else {
    const v = Room.view(g), reveal = st.screen === 'end';
    h = topbar(g) + '<div class="panel">' + track(g, v, reveal) + '</div>' + gauges(g, v);
    if (st.screen === 'decide') h += decide(g) + (st.brief ? brief(g) : '');
    if (st.screen === 'resolve') h += resolve(g) + (inNews() ? news(g) : '');
    if (st.screen === 'end') h += ending(g);
  }
  $('app').innerHTML = h; wire(); tick(); save();
}

function intro() {
  return '<div class="intro"><div class="lbl">A 30-minute game for a room · you are the President and the cabinet</div><h1>The Scramble</h1>' +
    '<p class="lede">It is January 2027. American labs are about six months ahead of China in the race to AI that can improve itself. You have seven turns, to the end of 2028, to get the world through it.</p>' +
    '<div class="three"><div><h3>The weights can be stolen</h3><p>Beijing\'s hackers go for the frontier model again and again. Today they would probably get it, and one success erases the lead.</p></div>' +
    '<div><h3>China is right behind</h3><p>Squeeze Beijing and you keep the lead but risk war over Taiwan. A mutual pause has a price: Beijing wants two things it has not told you, and your own labs have to agree to stop. Then Beijing has to keep it.</p></div>' +
    '<div><h3>No one knows where runaway starts</h3><p>Somewhere roughly a year ahead, AI starts improving itself. Race past that point and every turn is a coin flip on losing control. That goes for China too.</p></div></div>' +
    '<ol class="how"><li><b>Five groups, five seats:</b> the President (the labs), Director of National Intelligence, Commerce, State, War. Each group names its principal; the rest are the staff.</li>' +
    '<li><b>Each turn every seat has three options,</b> and they change with the situation. Staff argue, the principal decides. Talk to the other groups: a deal with Beijing or the labs takes several seats at once.</li>' +
    '<li><b>Then the world moves,</b> and the room finds out what Beijing, the hackers and the models did.</li>' +
    '<li><b>Odds come in the IC\'s words,</b> and they mean what they say: "unlikely" things happen about one time in four, and over seven turns some of them will.</li>' +
    '<li><b>From the second turn, each turn opens with a crisis.</b> It says what is at stake this turn and which seats can answer it.</li></ol>' +
    '<button class="btn" id="b-start">Start the clock</button>' +
    '<p class="fine">Facilitator: four minutes a round, crisis and news included; the round clock runs through all of it, so lock the turn in with a minute left for the news. Ask each principal for a decision and click it; Enter locks the turn in, Space steps through the news and moves on, U undoes a turn (the dice for a turn stay the same if you replay it). Add #seed=123 to the address to rehearse a game and run the same one live.</p></div>';
}

function decide(g) {
  const c = Room.crisis(g);
  let h = (c ? '<div class="crisis"><div class="lbl">This turn</div><b>' + esc(c.title) + '</b><span>' + esc(c.rule) + '</span></div>' : '') + '<div class="ask"><h2>The cabinet decides</h2><span>One choice per seat. All five take effect together.</span></div><div class="seats">';
  // An option the seat did not have last turn is tagged New.
  const before = st.past.length ? Room.seats(JSON.parse(st.past[st.past.length - 1])) : null;
  const isNew = (s, o) => before && !o.off && !before.find(x => x.id === s.id).opts.some(x => x.title === o.title && !x.off);
  for (const s of Room.seats(g)) {
    h += '<div class="seat' + (st.picks[s.id] ? ' set' : '') + '"><div><h3>' + esc(s.who) + '</h3><div class="brief">' + esc(s.brief) + '</div></div>';
    for (const o of s.opts) h += '<button class="opt' + (st.picks[s.id] === o.id ? ' on' : '') + '" data-seat="' + s.id + '" data-opt="' + o.id + '"' + (o.off ? ' disabled' : '') + '>' + (isNew(s, o) ? '<i class="new">New</i>' : '') + '<b>' + esc(o.title) + '</b><span>' + esc(o.text) + '</span></button>';
    h += '</div>';
  }
  const left = Room.seats(g).filter(s => !st.picks[s.id]).map(s => SHORT[s.id]);
  return h + '</div><div class="go"><button class="btn" id="b-lock"' + (ready() ? '' : ' disabled') + '>Lock in the turn</button><span class="hint">' + (left.length ? 'Waiting on: ' + left.join(', ') : 'Enter locks it in.') + '</span></div>';
}

function tags(picks) { return '<div class="tags">' + Object.keys(SHORT).map(k => '<span><i>' + SHORT[k] + '</i>' + esc(picks[k]) + '</span>').join('') + '</div>'; }
// The crisis that opens a turn; the round clock is already running.
function brief(g) {
  const c = Room.crisis(g);
  return '<div class="ov"><div class="news warn clip crisisn"><div class="mh"><span>' + esc(c.src) + '</span><b>' + Room.DATES[g.turn] + '</b></div>' +
    '<div class="mb"><h2>' + esc(c.title) + '</h2><p>' + esc(c.text) + '</p><p class="rule">' + esc(c.rule) + '</p></div>' +
    '<div class="go"><button class="btn" id="b-brief">To the cabinet</button><span class="hint">Space or Enter</span></div></div></div>';
}
// The turn's events, one bulletin at a time, before the recap screen. A rolled event first asks its question.
function news(g) {
  const e = st.events[st.news], n = st.events.length, last = st.news === n - 1;
  if (e.tease && !st.shown) return '<div class="ov"><div class="news tease"><div class="mh"><span>Developing</span><b>' + g.votes[g.votes.length - 1].date + '</b></div>' +
    '<div class="mb"><h2>' + esc(e.tease) + '</h2><p class="rule">The IC\'s estimate: ' + esc(e.odds) + '.</p></div>' +
    '<div class="go"><button class="btn" id="b-news">Reveal</button><span class="hint">Space or Enter</span></div></div></div>';
  let pips = ''; for (let i = 0; i < n; i++) pips += '<i class="' + (i <= st.news ? 'done' : '') + '"></i>';
  return '<div class="ov"><div class="news ' + e.tone + (e.src ? ' clip' : '') + (e.big ? ' big' : '') + '"><div class="mh"><span>' + esc(e.src || 'Situation Room') + '</span><b>' + g.votes[g.votes.length - 1].date + '</b></div>' +
    '<div class="mb"><h2>' + esc(e.title) + '</h2><p>' + esc(e.text) + '</p></div>' +
    '<div class="go"><button class="btn" id="b-news">' + (last ? 'Where that leaves us' : 'Next') + '</button><span class="hint">Space or Enter · Esc skips to the recap</span><div class="pips">' + pips + '</div></div></div></div>';
}
function resolve(g) {
  const last = g.votes[g.votes.length - 1];
  let h = '<div class="ask"><h2>' + last.date + ' · the cabinet decided</h2></div>' + tags(last.picks) + '<div class="evs">';
  st.events.forEach((e, i) => { h += '<div class="ev ' + e.tone + (e.src ? ' clip' : '') + (e.big ? ' big' : '') + '" style="animation-delay:' + (i * 0.06) + 's">' + (e.src ? '<div class="src">' + esc(e.src) + '</div>' : '') + '<b>' + esc(e.title) + '</b><p>' + esc(e.text) + '</p></div>'; });
  return h + '</div><div class="go"><button class="btn" id="b-next">' + (g.over ? 'See how it ends' : 'Next turn') + '</button><span class="hint">Space or Enter</span></div>';
}

function ending(g) {
  const o = g.over, v = Room.view(g), facts = [], m = Room.months, gap = (x, past, short) => x > g.line ? past : m(g.line - x) + ' ' + short;
  facts.push('Runaway RSI became possible <b>' + m(g.line) + '</b> past the January 2027 frontier. The US ended ' + gap(g.us, 'past that point.', 'short of it.'));
  facts.push('China ended ' + gap(g.cn, 'past that point too.', 'short of it.') + (Math.abs(g.cn - g.cnShown) >= 1 ? ' That is ' + m(g.cn - g.cnShown) + ' further than anyone knew.' : ''));
  facts.push('Beijing\'s price for a pause was ' + g.asks.map(a => Room.ASKS[a].short).join(' and ') + '.' + (g.known.every(Boolean) ? '' : ' The cabinet never learned all of it.'));
  if (g.deal) facts.push(g.hidden ? 'Beijing was running a hidden program under the deal.' : 'Beijing kept the deal.');
  facts.push((g.thefts ? 'The weights were stolen ' + (g.thefts > 1 ? g.thefts + ' times' : 'once') : 'The weights were never stolen') + '. The labs ended with ' + Room.SECURITY[g.sec] + ', and ' + v.labsText.toLowerCase() + '.');
  facts.push('The Strait ended ' + v.tensionText.toLowerCase() + '; relations with Beijing, ' + v.trustText.toLowerCase() + '.');
  return '<div class="panel end"><div class="grade ' + o.grade + '">' + o.grade + '</div><div><div class="lbl">' + (g.turn >= Room.TUNE.turns ? 'January 2029 · Inauguration Day' : 'It ended in ' + g.votes[g.votes.length - 1].date) + '</div><h1>' + esc(o.title) + '</h1><p>' + esc(o.text) + '</p></div></div>' +
    '<div class="cols"><div class="panel"><div class="lbl">What was hidden</div><ul>' + facts.map(f => '<li>' + f + '</li>').join('') + '</ul></div>' +
    '<div class="panel"><div class="lbl">What the cabinet did</div><table><tr><th></th>' + Object.values(SHORT).map(x => '<th>' + x + '</th>').join('') + '</tr>' +
    g.votes.map(x => '<tr><td>' + x.date + '</td>' + Object.keys(SHORT).map(k => '<td>' + esc(x.picks[k]) + '</td>').join('') + '</tr>').join('') + '</table></div></div>' +
    '<div class="go"><button class="btn" id="b-again">New game</button><button class="ghost" id="b-same">Replay this game (seed ' + esc(g.seed) + ')</button></div>';
}

function wire() {
  const on = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  on('b-start', () => start(seedFromHash()));
  on('b-lock', lockIn); on('b-next', next); on('b-undo', undo); on('b-news', () => nextNews()); on('b-brief', endBrief);
  on('b-new', () => { st = { screen: 'intro', game: null, past: [], events: [], news: -1, picks: {} }; draw(); });
  on('b-again', () => start(String(Math.floor(Math.random() * 1e6))));
  on('b-same', () => start(st.game.seed));
  document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { if (!b.disabled) { st.picks[b.dataset.seat] = b.dataset.opt; draw(); } });
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (st.screen === 'decide' && st.brief) { if (k === 'enter' || k === ' ' || k === 'escape') { e.preventDefault(); endBrief(); } return; }
  if (st.screen === 'decide' && k === 'enter') { e.preventDefault(); lockIn(); }
  else if (inNews()) { if (k === 'enter' || k === ' ' || k === 'escape') { e.preventDefault(); nextNews(k === 'escape'); } return; }
  else if (st.screen === 'resolve' && (k === 'enter' || k === ' ')) { e.preventDefault(); next(); }
  if (k === 'u' && st.screen !== 'intro') undo();
});

const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function tick() {
  const a = $('ck-turn'), b = $('ck-game'); if (!a) return;
  if (st.screen === 'decide' || st.screen === 'resolve') { const left = TURN_SECS - (Date.now() - st.turnT0) / 1000; a.textContent = left >= 0 ? mmss(left) : '+' + mmss(-left); a.className = left < 0 ? 'late' : ''; }
  else a.textContent = '-';
  const el = (Date.now() - st.t0) / 1000; b.textContent = mmss(el); b.className = el > GAME_MINS * 60 ? 'late' : '';
}
setInterval(tick, 500);
load(); draw();
</script>
</body>
</html>
