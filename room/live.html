<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Scramble: Room Edition, free response</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* One projected screen: top bar, the race track over one line of facts, then each table's moves under who it is dealing with, and the bold moves, or the turn's events. */
:root{
  --bg:#E3E8ED; --sheet:#F8F9FB; --sheet2:#EEF2F6; --ink:#15202B; --muted:#56626F; --faint:#9AA6B2; --rule:#C8D0D9;
  --accent:#1A4480; --accent-ink:#fff; --accent-soft:#DCE6F3;
  --good:#22744A; --bad:#B42318; --warn:#9A5B00; --cn:#B8323A; --us:#1A4480;
  --f-ui:"Public Sans","Helvetica Neue",Arial,sans-serif; --f-body:"Source Serif 4",Georgia,serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --sheet:#151E28; --sheet2:#1B2632; --ink:#E3E9EF; --muted:#9AA7B4; --faint:#5F6D7B; --rule:#2A3746;
  --accent:#8FB4EC; --accent-ink:#0D131A; --accent-soft:#1E3150; --good:#6FD39A; --bad:#F38A80; --warn:#F2B65C; --cn:#F0828A; --us:#8FB4EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131A; --sheet:#151E28; --sheet2:#1B2632; --ink:#E3E9EF; --muted:#9AA7B4; --faint:#5F6D7B; --rule:#2A3746;
  --accent:#8FB4EC; --accent-ink:#0D131A; --accent-soft:#1E3150; --good:#6FD39A; --bad:#F38A80; --warn:#F2B65C; --cn:#F0828A; --us:#8FB4EC; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:clamp(14px,1.15vw,19px);line-height:1.4}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:.72em;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1700px;margin:0 auto;padding:0 16px 20px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:10px 0;border-bottom:3px double var(--rule)}
.mark{font-weight:900;font-size:1.25em;letter-spacing:-.01em}
.pips{display:flex;gap:5px;align-items:center}
.pips i{width:26px;height:10px;background:var(--rule)} .pips i.done{background:var(--accent)} .pips i.now{background:var(--accent);outline:2px solid var(--accent);outline-offset:2px}
.date{font-weight:800;font-size:1.15em}
.sp{flex:1}
.clock{text-align:right;line-height:1.15} .clock b{font-family:var(--f-mono);font-size:1.5em;font-weight:600} .clock b.late{color:var(--bad)}
.ghost{all:unset;box-sizing:border-box;cursor:pointer;font-weight:700;font-size:.8em;color:var(--accent);border:1px solid var(--accent);padding:6px 10px;white-space:nowrap}
.ghost:hover{background:var(--accent-soft)} .ghost[disabled]{opacity:.35;cursor:not-allowed}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:14px 26px;text-align:center}
.btn:hover{filter:brightness(1.1)} .btn[disabled]{opacity:.35;cursor:not-allowed;filter:none}
:is(.btn,.ghost,.opt):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--sheet);border:1px solid var(--rule);padding:12px 16px;margin-top:12px}

/* the race track: months of frontier progress, -6 to 22 */
.track{position:relative;height:118px;margin:4px 56px 0}
.rail{position:absolute;left:0;right:0;top:54px;height:10px;background:var(--sheet2);border:1px solid var(--rule)}
.band{position:absolute;top:26px;height:66px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bad) 30%,transparent) 0 6px,color-mix(in srgb,var(--bad) 10%,transparent) 6px 12px);border-left:2px solid var(--bad);border-right:2px solid var(--bad);transition:left .8s,width .8s}
.band span{position:absolute;left:50%;top:-22px;transform:translateX(-50%);white-space:nowrap;font-size:.72em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--bad)}
.truth{position:absolute;top:18px;height:82px;width:0;border-left:3px solid var(--ink)}
.truth span{position:absolute;top:-20px;left:-3px;white-space:nowrap;font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.tick{position:absolute;top:66px;width:1px;height:8px;background:var(--faint)} .tick span{position:absolute;top:36px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:.68em;color:var(--faint);white-space:nowrap}
.mk{position:absolute;transform:translateX(-50%);transition:left .9s cubic-bezier(.3,.7,.3,1);font-weight:900;font-size:.8em;letter-spacing:.06em;color:#fff;padding:3px 9px;white-space:nowrap}
.mk::after{content:"";position:absolute;left:50%;margin-left:-6px;border:6px solid transparent}
.mk.us{top:26px;background:var(--us);color:var(--accent-ink)} .mk.us::after{top:100%;border-top-color:var(--us)}
.mk.cn{top:70px;background:var(--cn);color:var(--accent-ink)} .mk.cn::after{bottom:100%;border-bottom-color:var(--cn)}
@media (prefers-reduced-motion:reduce){.mk,.band{transition:none}}

.facts{display:flex;flex-wrap:wrap;gap:6px 34px;margin-top:10px;font-size:1.05em;color:var(--muted)} .facts b{color:var(--ink)}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.seat .lock{font-size:.95em;font-weight:800;line-height:1.3} .seat .lock i{font-style:normal;font-weight:400;color:var(--muted)}
.pill{display:inline-block;margin:3px 4px 0 0;padding:1px 7px;border:1px solid var(--rule);font-weight:700;color:var(--ink);white-space:nowrap}
.pill.ok{border-color:var(--good);color:var(--good)} .pill.no{border-color:var(--bad);color:var(--bad)} .pill.unk{border-style:dashed;color:var(--muted)}
.bar{height:7px;background:var(--sheet2);border:1px solid var(--rule);margin:5px 0 3px} .bar i{display:block;height:100%;background:var(--accent);transition:width .8s}
.bar.t i{background:var(--bad)}

.seats,.bolds{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px} .bolds{margin-top:4px} .bl{margin-top:14px}
.seat{background:var(--sheet);border:1px solid var(--rule);border-top:5px solid var(--accent);padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px;min-width:0}
.seat.set{border-top-color:var(--good)}
.seat h3{margin:0;font-size:.8em;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.opt .tag{float:right;font-style:normal;font-family:var(--f-ui);font-size:.62em;font-weight:900;letter-spacing:.12em;text-transform:uppercase;background:var(--warn);color:var(--accent-ink);padding:2px 6px;margin-left:8px}
.opt.cr{border-color:var(--warn)} .opt.cr b{color:var(--warn)}
.seat .opt b{font-size:1.1em} .seat .opt span{font-size:.95em}
.opt .who{display:block;font-style:normal;font-size:.68em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:block;border:2px solid var(--rule);background:var(--sheet2);padding:6px 9px}
.opt:hover{border-color:var(--accent)} .opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.opt[disabled]{opacity:.4;cursor:not-allowed;border-color:var(--rule)}
.digest{list-style:none;margin:10px 0 0;padding:0} .digest li{padding:8px 0;border-top:1px solid var(--rule);font-family:var(--f-body);line-height:1.35} .digest b{display:block;font-family:inherit;font-weight:900}
.opt b{display:block;font-weight:900;line-height:1.2} .opt span{display:block;font-family:var(--f-body);font-size:.82em;line-height:1.3;color:var(--muted);margin-top:2px} .opt.on span{color:var(--ink)}
.go{display:flex;align-items:center;gap:16px;margin-top:14px} .go .hint{color:var(--muted);font-size:.85em}

.evs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.ev{background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--faint);padding:9px 14px;animation:in .45s both}
.ev b{font-weight:900;font-size:1.08em} .ev p{margin:2px 0 0;font-family:var(--f-body)}
.ev blockquote{margin:0;font-family:var(--f-body);font-style:italic} .ev .by{font-size:.8em;color:var(--muted);margin:2px 0 4px} .ev.big blockquote{font-size:1.25em;margin-top:8px}
.ev.big{grid-column:1/-1;border:2px solid var(--bad);border-left-width:14px;padding:18px 22px;animation:in .45s both,alarm 1.1s 3 both}
.ev.big b{display:block;font-size:2.3em;line-height:1.05;text-transform:uppercase;letter-spacing:.02em} .ev.big p{font-size:1.25em;margin-top:8px}
@keyframes alarm{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 8px var(--bad)}}
.ev.good{border-left-color:var(--good)} .ev.good b{color:var(--good)} .ev.bad{border-left-color:var(--bad)} .ev.bad b{color:var(--bad)} .ev.warn{border-left-color:var(--warn)} .ev.warn b{color:var(--warn)}
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 97%,transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.news{background:var(--sheet);border:1px solid var(--rule);border-top:8px solid var(--faint);width:min(1100px,100%);box-shadow:0 30px 80px -30px rgba(0,0,0,.6);animation:in .3s both}
.news.good{border-top-color:var(--good)} .news.bad{border-top-color:var(--bad)} .news.warn{border-top-color:var(--warn)}
.news .mh{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 26px 12px;border-bottom:1px solid var(--rule);font-family:var(--f-mono);font-size:.85em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)} .news .mh b{color:var(--ink);font-size:2.6em;font-weight:900;letter-spacing:.02em;line-height:1} .news .mh span{font-weight:900}
.news blockquote{margin:0;font-family:var(--f-body);font-size:1.6em;line-height:1.3;font-style:italic} .news .by{margin:8px 0 14px;font-size:1.15em;color:var(--muted)} .news.big .mh span{color:var(--bad)} .news.crisisn .mh span{color:var(--warn)}
.news .mb{padding:22px 26px 8px} .news h2{margin:0 0 12px;font-size:2.5em;line-height:1.05;font-weight:900} .news p{margin:0;font-family:var(--f-body);font-size:1.5em;line-height:1.35}
.news.good h2{color:var(--good)} .news.bad h2{color:var(--bad)} .news.warn h2{color:var(--warn)}
.news .go{padding:0 26px 22px} .news .pips{display:flex;gap:5px;margin-left:auto} .news .pips i{width:22px;height:6px;background:var(--rule)} .news .pips i.done{background:var(--accent)}
.news.big{border:3px solid var(--bad);border-top-width:8px;animation:in .3s both,alarm 1.1s 3 both} .news.big h2{font-size:4em;text-transform:uppercase;letter-spacing:.01em}
.news p.rule{margin-top:16px;font-style:normal;font-family:var(--f-mono);font-size:1.05em;line-height:1.4;padding:12px 14px;border-left:5px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.news.crisisn{border:3px solid var(--warn);border-top-width:8px}
.crisis{display:flex;align-items:baseline;gap:14px;margin:14px 0 0;padding:10px 14px;border:2px solid var(--warn);border-left-width:8px;background:color-mix(in srgb,var(--warn) 9%,transparent)} .crisis b{font-size:1.15em;font-weight:900;color:var(--warn);white-space:nowrap} .crisis span{font-size:1em}
@media (prefers-reduced-motion:reduce){.news,.news.big{animation:none}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ev,.ev.big{animation:none}}

.intro{max-width:1100px;margin:3vh auto 0} .intro h1{font-size:3em;font-weight:900;letter-spacing:-.02em;margin:0 0 4px} .intro .lede{font-family:var(--f-body);font-size:1.3em;margin:8px 0 18px;max-width:38em}
.end{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;align-items:center}
.grade{font-size:7em;font-weight:900;line-height:1;width:1.5em;height:1.5em;display:grid;place-items:center;border:6px solid currentColor}
.grade.A,.grade.B{color:var(--good)} .grade.C{color:var(--warn)} .grade.D,.grade.F{color:var(--bad)}
.end h1{margin:0;font-size:2.6em;font-weight:900;letter-spacing:-.02em} .end p{margin:6px 0 0;font-family:var(--f-body);font-size:1.25em;max-width:40em}
@media (max-width:900px){.seats,.bolds,.evs{grid-template-columns:1fr}.end{grid-template-columns:1fr}.grade{font-size:4em}.intro h1{font-size:2.1em}.tick span{display:none}}

/* free response: each table's order, then the answers */
.seat textarea{font:inherit;font-family:var(--f-body);font-size:1.15em;line-height:1.3;color:var(--ink);background:var(--sheet2);border:2px solid var(--rule);padding:8px 10px;min-height:5.2em;resize:vertical;width:100%}
.seat textarea:focus{outline:none;border-color:var(--accent)}
.seat .order{font-family:var(--f-body);color:var(--muted);font-size:.95em;margin:0}
.seat blockquote{margin:0;font-family:var(--f-body);font-size:1.3em;line-height:1.3;font-style:italic} .seat blockquote:focus{outline:2px solid var(--accent);outline-offset:3px}
.seat .by{font-size:.9em;color:var(--muted)}
.wait{margin-top:14px;font-family:var(--f-body);font-size:1.4em;color:var(--muted)} .err{color:var(--bad);font-weight:700}
.drawer{margin-top:14px;border:1px dashed var(--faint);padding:10px 12px;font-size:.8em} .drawer textarea{width:100%;min-height:16em;font-family:var(--f-mono);font-size:.95em;color:var(--ink);background:var(--sheet2);border:1px solid var(--rule)} .drawer pre{white-space:pre-wrap;font-family:var(--f-mono);margin:8px 0 0;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="world.js"></script>
<script>
'use strict';
// The facilitator's screen for the free-response game; the ledger is world.js and the game master is gm.js (POST /gm).
// Each table says its order and the facilitator types it. Send asks the game master; its answers can be edited before Go applies them.
// G opens the facilitator's drawer (the ruling, the game master's note, the hidden facts). U undoes a turn.
const TURN_SECS = 240, GAME_MINS = 35, SAVE = 'scramble-live-v2', IDS = Object.keys(World.TABLES);
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
// screen: intro, orders, wait, answers, news, end. answer: the game master's reply for this turn. news: index of the bulletin on screen.
let st = { screen: 'intro', game: null, past: [], orders: {}, answer: null, error: '', events: [], news: 0, drawer: false, t0: 0, turnT0: 0 };

function seedFromHash() { const m = /seed=([\w-]+)/.exec(location.hash); return m ? m[1] : String(Math.floor(Math.random() * 1e6)); }
function save() { try { localStorage.setItem(SAVE, JSON.stringify(st)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem(SAVE)); if (s && s.game) { st = s; if (st.screen === 'wait') st.screen = 'orders'; } } catch (e) {} }
function keep() { document.querySelectorAll('[data-order]').forEach(t => st.orders[t.dataset.order] = t.value); document.querySelectorAll('[data-reply]').forEach(q => st.answer.replies[+q.dataset.reply].quote = q.textContent.trim()); const r = $('ruling'); if (r) st.rulingText = r.value; }

function start(seed) { st = { screen: 'orders', game: World.newGame(seed), past: [], orders: {}, answer: null, error: '', events: [], news: 0, drawer: false, t0: Date.now(), turnT0: Date.now() }; draw(); }
async function ask() {
  keep();
  if (!IDS.some(k => (st.orders[k] || '').trim())) return;
  st.screen = 'wait'; st.error = ''; draw();
  try {
    const res = await fetch('gm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ state: st.game, orders: st.orders }) }), out = await res.json();
    if (!res.ok) throw new Error(out.error || res.status);
    st.answer = out; st.rulingText = JSON.stringify(out.ruling, null, 1); st.screen = 'answers';
  } catch (e) { st.screen = 'orders'; st.error = 'The game master did not answer (' + e.message + '). Is `node room/gm.js` running?'; }
  draw();
}
function go() {
  keep();
  let ruling; try { ruling = JSON.parse(st.rulingText); } catch (e) { st.error = 'The ruling is not valid JSON.'; st.drawer = true; return draw(); }
  const g = st.game, date = World.DATES[g.turn];
  st.past.push(JSON.stringify(g));
  st.events = World.play(g, ruling);
  // the game master's words replace the ledger's stock updates where the ledger left room for one
  const up = st.answer.updates || {};
  for (const e of st.events) { const u = e.title === 'From Beijing' ? up.beijing : e.title === 'From the labs' ? up.labs : null; if (u && u.quote) { e.text = '"' + String(u.quote).replace(/"/g, "'") + '"'; e.src = u.by; } }
  g.log.push({ date, orders: st.orders, replies: st.answer.replies, updates: st.answer.updates || null, events: st.events.map(e => e.title) });
  st.error = ''; st.news = 0; st.screen = 'news';
  if (st.events.length) draw(); else next();
}
function next() {
  if (st.screen === 'news' && st.news + 1 < st.events.length) { st.news++; return draw(); }
  if (st.game.over) st.screen = 'end'; else { st.screen = 'orders'; st.orders = {}; st.answer = null; st.turnT0 = Date.now(); }
  draw();
}
function undo() { if (!st.past.length) return; st.game = JSON.parse(st.past.pop()); st.screen = 'orders'; st.orders = st.game.log.length ? {} : st.orders; st.answer = null; st.events = []; st.error = ''; st.turnT0 = Date.now(); draw(); }

const X0 = -6, X1 = 22, pos = x => Math.max(0, Math.min(100, (x - X0) / (X1 - X0) * 100)) + '%';
function track(g, v, reveal) {
  let h = '<div class="track"><div class="rail"></div>';
  h += '<div class="band" style="left:' + pos(v.lo) + ';width:calc(' + pos(v.hi) + ' - ' + pos(v.lo) + ')">' + (reveal ? '' : '<span>IC suggests runaway RSI possible in this range</span>') + '</div>';
  for (let x = X0; x <= X1; x += 2) h += '<div class="tick" style="left:' + pos(x) + '">' + (x % 6 === 0 ? '<span>' + (x === 0 ? 'Jan 2027 frontier' : (x > 0 ? '+' : '-') + Math.abs(x) + ' months') + '</span>' : '') + '</div>';
  if (reveal) h += '<div class="truth" style="left:' + pos(g.line) + '"><span>Runaway RSI was possible from here</span></div>';
  return h + '<div class="mk us" style="left:' + pos(g.us) + '">US</div><div class="mk cn" style="left:' + pos(reveal ? g.cn : g.cnShown) + '">CHINA</div></div>';
}
function facts(g, v) {
  const sc = v.strait === 'Calm' ? 'good' : v.strait === 'Tense' ? 'warn' : 'bad';
  return '<div class="facts"><span>US lead' + (g.deal && !g.caught ? ', by Beijing\'s account' : '') + ': <b>' + v.leadText.toLowerCase() + '</b></span>' +
    '<span>Taiwan Strait: <b class="' + sc + '">' + v.strait.toLowerCase().replace('beijing', 'Beijing') + '</b></span></div>';
}
// Who each table is dealing with, shown over its box.
function lock(g, v, id) {
  const L = (label, c, txt, more) => '<div class="lock"><i>' + label + ': </i><span class="' + c + '">' + txt + '</span>' + (more || '') + '</div>';
  if (id === 'wh') return L('The labs', g.national || v.labsText === 'Would stop' ? 'good' : v.labsText === 'Defiant' ? 'bad' : 'warn', v.labsText.toLowerCase()) + L('Their security', 'warn', v.security);
  if (id === 'state') {
    if (g.deal) return L('A pause is signed', g.caught ? 'bad' : 'good', g.caught ? 'and Beijing is cheating' : 'and holding', '<br>' + v.deal.map(x => '<span class="pill">' + esc(x) + '</span>').join(''));
    return v.talking ? L('Beijing', 'warn', 'will talk') : L('Beijing', 'bad', 'is not talking');
  }
  return L('Inside Beijing', g.eyes > 1 ? 'good' : g.eyes ? 'warn' : 'bad', v.eyesText.toLowerCase());
}
function topbar(g) {
  const n = st.screen === 'news' || st.screen === 'end' ? g.log.length - 1 : g.turn;
  let pips = ''; for (let i = 0; i < World.TUNE.turns; i++) pips += '<i class="' + (i < n ? 'done' : i === n && st.screen !== 'end' ? 'now' : '') + '"></i>';
  return '<div class="top"><div class="mark">The Scramble</div><div class="pips">' + pips + '</div>' +
    '<div class="date">' + (st.screen === 'end' ? 'The end' : 'Turn ' + (n + 1) + ' of ' + World.TUNE.turns + ' · ' + World.DATES[n]) + '</div><div class="sp"></div>' +
    '<div class="clock"><div class="lbl">Round</div><b id="ck-turn">-</b></div><div class="clock"><div class="lbl">Game</div><b id="ck-game">-</b></div>' +
    '<button class="ghost" id="b-undo"' + (st.past.length ? '' : ' disabled') + '>Undo</button><button class="ghost" id="b-new">Restart</button></div>';
}

function draw() {
  const g = st.game; let h = '';
  if (st.screen === 'intro') h = '<div class="intro"><h1>The Scramble</h1><p class="lede">January 2027. The intelligence community warns that AI able to improve itself may be less than a year of progress away. Nobody knows exactly where. American labs are about six months ahead of China, and Beijing\'s hackers are trying to get into them. You have seven turns, to the end of 2028. Each table says what it does.</p><button class="btn" id="b-start">Start</button></div>';
  else {
    const v = World.view(g);
    h = topbar(g) + '<div class="panel">' + track(g, v, st.screen === 'end') + facts(g, v) + '</div>';
    if (st.screen === 'end') h += ending(g); else h += seats(g, v);
    if (st.screen === 'news') h += news(g);
  }
  $('app').innerHTML = h; wire(); tick(); save();
}
function seats(g, v) {
  const a = st.screen === 'answers' || st.screen === 'news' ? st.answer : null;
  let h = '<div class="seats">';
  for (const k of IDS) {
    h += '<div class="seat"><h3>' + World.TABLES[k] + '</h3>';
    if (!a) h += lock(g, v, k) + '<textarea data-order="' + k + '" placeholder="What does ' + (k === 'wh' ? 'the White House' : k === 'state' ? 'State' : 'the Pentagon') + ' do?"' + (st.screen === 'wait' ? ' disabled' : '') + '>' + esc(st.orders[k] || '') + '</textarea>';
    else {
      h += '<p class="order">' + esc(st.orders[k] || 'No order.') + '</p>';
      a.replies.forEach((r, i) => { if (r.table === k) h += '<blockquote contenteditable="true" data-reply="' + i + '">' + esc(r.quote) + '</blockquote><div class="by">' + esc(r.by) + '</div>'; });
    }
    h += '</div>';
  }
  h += '</div>';
  if (st.screen === 'wait') return h + '<div class="wait">Waiting for answers from the labs, Beijing and the agencies...</div>';
  h += '<div class="go">' + (a ? '<button class="btn" id="b-go">Go</button><button class="ghost" id="b-ask">Ask again</button><button class="ghost" id="b-back">Change the orders</button>' : '<button class="btn" id="b-ask">Send</button>') + '<span class="hint err">' + esc(st.error) + '</span></div>';
  if (st.drawer) h += '<div class="drawer"><div class="lbl">Facilitator</div>' + (a ? '<p>' + esc(a.note) + (a.secs ? ' (' + a.secs + 's)' : '') + '</p><textarea id="ruling">' + esc(st.rulingText) + '</textarea>' : '') + '<pre>' + esc(World.brief(g)) + '</pre></div>';
  return h;
}
// An event's text: a leading quote is set as a quotation with its byline straight after it, then any narration.
function body(text, src) {
  const m = /^("[^"]*")\s*([\s\S]*)$/.exec(text), by = src ? '<div class="by">' + esc(src) + '</div>' : '';
  return m ? '<blockquote>' + esc(m[1]) + '</blockquote>' + by + (m[2] ? '<p>' + esc(m[2]) + '</p>' : '') : '<p>' + esc(text) + '</p>' + by;
}
function news(g) {
  const e = st.events[st.news], n = st.events.length, last = st.news === n - 1;
  let pips = ''; for (let i = 0; i < n; i++) pips += '<i class="' + (i <= st.news ? 'done' : '') + '"></i>';
  return '<div class="ov"><div class="news ' + e.tone + (e.big ? ' big' : '') + '"><div class="mh"><b>' + g.log[g.log.length - 1].date + '</b><span>' + (e.big ? 'Flash' : '') + '</span></div>' +
    '<div class="mb"><h2>' + esc(e.title) + '</h2>' + body(e.text, e.src) + '</div>' +
    '<div class="go"><button class="btn" id="b-next">' + (last ? (g.over ? 'See how it ends' : 'Next turn') : 'Next') + '</button><div class="pips">' + pips + '</div></div></div></div>';
}
function ending(g) {
  const o = g.over;
  return '<div class="panel end"><div class="grade ' + o.grade + '">' + o.grade + '</div><div><div class="lbl">' + (g.turn >= World.TUNE.turns ? 'January 2029 · Inauguration Day' : 'It ended in ' + g.log[g.log.length - 1].date) + '</div><h1>' + esc(o.title) + '</h1><p>' + esc(o.text) + '</p></div></div>' +
    '<div class="go"><button class="btn" id="b-again">New game</button><button class="ghost" id="b-same">Replay (seed ' + esc(g.seed) + ')</button></div>';
}

function wire() {
  const on = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  on('b-start', () => start(seedFromHash())); on('b-ask', ask); on('b-go', go); on('b-next', next); on('b-undo', undo);
  on('b-back', () => { keep(); st.answer = null; st.screen = 'orders'; draw(); });
  on('b-new', () => { st = { screen: 'intro', game: null, past: [], orders: {}, events: [] }; draw(); });
  on('b-again', () => start(String(Math.floor(Math.random() * 1e6)))); on('b-same', () => start(st.game.seed));
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), typing = /^(textarea|input)$/i.test(e.target.tagName) || e.target.isContentEditable;
  if (st.screen === 'news') { if (k === 'enter' || k === ' ') { e.preventDefault(); next(); } return; }
  if (typing) return;
  if (k === 'g' && st.game) { keep(); st.drawer = !st.drawer; draw(); }
  else if (k === 'u' && st.game) undo();
  else if (k === 'enter' && st.screen === 'orders') ask();
  else if (k === 'enter' && st.screen === 'answers') go();
});

const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function tick() {
  const a = $('ck-turn'), b = $('ck-game'); if (!a) return;
  if (st.screen !== 'end') { const left = TURN_SECS - (Date.now() - st.turnT0) / 1000; a.textContent = left >= 0 ? mmss(left) : '+' + mmss(-left); a.className = left < 0 ? 'late' : ''; } else a.textContent = '-';
  const el = (Date.now() - st.t0) / 1000; b.textContent = mmss(el); b.className = el > GAME_MINS * 60 ? 'late' : '';
}
setInterval(tick, 500);
load(); draw();
</script>
</body>
</html>
